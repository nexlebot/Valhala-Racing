version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -e SCRAPER_TOKEN -e ADMIN_PASSWORD -e S3_BUCKET_NAME >> .env.production
        - echo "S3_REGION=ap-southeast-2" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
